<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prom Night '99</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0f; --gold: #e0b02a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #screen { flex: 1; position: relative; min-height: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #pad { display: none; height: 150px; flex: none; justify-content: space-between; align-items: center; padding: 0 22px; background: #141418; border-top: 3px solid var(--gold); }
  @media (pointer: coarse) { #pad { display: flex; } }
  .dpad { position: relative; width: 132px; height: 132px; }
  .dpad div, .ab div { position: absolute; background: #2a2a32; border: 2px solid #000; border-radius: 8px; color: #ccc; font: 12px "Press Start 2P", monospace; display: flex; align-items: center; justify-content: center; }
  .dpad div { width: 44px; height: 44px; }
  .dpad [data-b=U] { left: 44px; top: 0; } .dpad [data-b=D] { left: 44px; bottom: 0; } .dpad [data-b=L] { left: 0; top: 44px; } .dpad [data-b=R] { right: 0; top: 44px; }
  .ab { position: relative; width: 140px; height: 120px; }
  .ab div { width: 60px; height: 60px; border-radius: 50%; }
  .ab [data-b=A] { right: 0; top: 10px; background: var(--gold); color: #000; } .ab [data-b=B] { left: 0; bottom: 4px; background: #3a3a44; }
  .on { filter: brightness(1.5); }
</style>
</head>
<body>
<div id="wrap">
  <div id="screen"><canvas id="game"></canvas></div>
  <div id="pad">
    <div class="dpad"><div data-b="U">▲</div><div data-b="L">◀</div><div data-b="R">▶</div><div data-b="D">▼</div></div>
    <div class="ab"><div data-b="B">B</div><div data-b="A">A</div></div>
  </div>
</div>
<script>
'use strict';
// ================= CORE: canvas, input, text, timers, audio =================
const W = 384, H = 216;
const cv = document.getElementById('game');
const D = cv.getContext('2d');
const K = 3; // render at 3x logical resolution so the cartoon outlines stay smooth
const buf = document.createElement('canvas'); buf.width = W * K; buf.height = H * K;
const X = buf.getContext('2d');
const ubuf = document.createElement('canvas'); ubuf.width = W * K; ubuf.height = H * K;
const U = ubuf.getContext('2d');
let SC = 3, OX = 0, OY = 0;
function resize() {
  const box = document.getElementById('screen').getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
  SC = Math.min(cv.width / W, cv.height / H);
  OX = Math.round((cv.width - W * SC) / 2); OY = Math.round((cv.height - H * SC) / 2);
}
addEventListener('resize', resize);

// ---------- helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
// ---------- vivid palette: every hex colour drawn through these helpers gets a saturation boost ----------
let VIVID = true; // characters switch it off and boost their own colours (skin stays natural)
const VCACHE = new Map();
function vivid(col) {
  if (typeof col != 'string' || col[0] != '#') return col;
  let v = VCACHE.get(col); if (v) return v;
  let hx = col.length == 4 ? col[1] + col[1] + col[2] + col[2] + col[3] + col[3] : col.slice(1, 7);
  const n = parseInt(hx, 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let l = (mx + mn) / 2, s = 0, h = 0;
  if (mx != mn) {
    const d = mx - mn; s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx == r ? (g - b) / d + (g < b ? 6 : 0) : mx == g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6;
    s = Math.min(1, s * 1.45 + 0.05);
  }
  l = l + (0.5 - Math.abs(l - 0.5)) * 0.1;
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, pp = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? pp + (q - pp) * 6 * t : t < 0.5 ? q : t < 2 / 3 ? pp + (q - pp) * (2 / 3 - t) * 6 : pp; };
  const to = x => Math.round(clamp(x, 0, 1) * 255);

}
const vc = col => VIVID ? vivid(col) : col;
function R(c, x, y, w, h, col) { c.fillStyle = vc(col); c.fillRect(Math.round(x), Math.round(y), w, h); }
function O(c, x, y, w, h, fill, line) { R(c, x, y, w, h, line); R(c, x + 1, y + 1, w - 2, h - 2, fill); }
function RR(c, x, y, w, h, fill, line) { // rounded box, 1px outline
  x = Math.round(x); y = Math.round(y);
  R(c, x + 2, y, w - 4, h, line); R(c, x, y + 2, w, h - 4, line); R(c, x + 1, y + 1, w - 2, h - 2, line);
  if (fill) { R(c, x + 2, y + 1, w - 4, h - 2, fill); R(c, x + 1, y + 2, w - 2, h - 4, fill); }
}
function oval(c, cx, cy, rx, ry, col) {
  c.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.0001))));
    c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
  }
}

// ---------- vector helpers (cartoon style: flat fill + ink outline) ----------
const LW = 1.5;
const OL = '#4a2e20'; // prop outline: a warm brown rather than black ink
function F(c, x, y, w, h, col) { c.fillStyle = vc(col); c.fillRect(x, y, w, h); }
function ell(c, x, y, rx, ry, fill, lw = LW, rot = 0) {
  c.beginPath(); c.ellipse(x, y, Math.max(0.1, Math.abs(rx)), Math.max(0.1, Math.abs(ry)), rot, 0, Math.PI * 2);
  if (fill) { c.fillStyle = vc(fill); c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = OL; c.stroke(); }
}
function poly(c, p, fill, lw = LW) {
  c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath();
  if (fill) { c.fillStyle = vc(fill); c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = OL; c.stroke(); }
}
function rbox(c, x, y, w, h, r, fill, lw = LW) {
  c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2))); else c.rect(x, y, w, h);
  if (fill) { c.fillStyle = vc(fill); c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = OL; c.stroke(); }
}
function line(c, p, lw = LW, col = INK) { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.lineWidth = lw; c.strokeStyle = vc(col); c.stroke(); }
function curve(c, x0, y0, cx, cy, x1, y1, lw = LW, col = INK) { c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(cx, cy, x1, y1); c.lineWidth = lw; c.strokeStyle = vc(col); c.stroke(); }
function limb(c, x0, y0, x1, y1, w, col) { // thick outlined stroke (arms, legs)
  c.lineCap = 'round'; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1);
  c.lineWidth = w + LW * 2; c.strokeStyle = OL; c.stroke(); c.lineWidth = w; c.strokeStyle = vc(col); c.stroke();
}

// ---------- stage projection ----------
// Scenes are authored in the old top-down "logical" space (384x216). In a scene, V.on maps that
// space onto a side-view stage: x stretches by V.zx and scrolls with the camera, logical rows
// above V.y0 become the back wall, and rows below it become a floor band between FT and FB.
// With V.on false (minigames, UI) everything is drawn 1:1 in screen space.
const FT = 116, FB = 208;
// Full-screen layouts (car interiors) instead use a plain uniform zoom V.z with V.on false.
const V = { front: false, on: false, zx: 1, z: 1, cam: 0, camy: 0, y0: 60, y1: 212, cs: 0.36, seam: FT };

function PY(y) { if (!V.on) return y * V.z - V.camy; return y <= V.y0 ? y * FT / V.y0 : FT + (y - V.y0) * (FB - FT) / Math.max(1, V.y1 - V.y0); }
function PS(y) { return V.on ? V.cs * lerp(0.8, 1, clamp((y - V.y0) / Math.max(1, V.y1 - V.y0), 0, 1)) : V.cs * V.z; }
const KX = () => V.on ? V.zx : V.z;          // horizontal prop scale
const hv = (flat, stage) => V.on ? stage : flat * V.z; // pick a prop height for the current view
// redraw a scene prop over the actors standing behind it (V.front skips its back parts: headboards, booth backs...)
function propFront(c, p) { V.front = true; SET[p.fn](c, ...p.a); V.front = false; }
function PR(c, x, y, w, h, col) { const x0 = PX(x), y0 = PY(y); F(c, x0, y0, PX(x + w) - x0, PY(y + h) - y0, col); }
function PO(c, x, y, w, h, fill, line) { const x0 = PX(x), y0 = PY(y), x1 = PX(x + w), y1 = PY(y + h); F(c, x0, y0, x1 - x0, y1 - y0, line); F(c, x0 + 1, y0 + 1, x1 - x0 - 2, y1 - y0 - 2, fill); }
function PRR(c, x, y, w, h, fill, line) { const x0 = PX(x), y0 = PY(y); c.save(); rbox(c, x0, y0, PX(x + w) - x0, PY(y + h) - y0, 3, fill, 0); c.lineWidth = 1; c.strokeStyle = line; c.stroke(); c.restore(); }
function Poval(c, cx, cy, rx, ry, col) { const y0 = PY(cy - ry), y1 = PY(cy + ry); ell(c, PX(cx), (y0 + y1) / 2, rx * KX(), (y1 - y0) / 2, col, 0); }

// ---------- text (drawn crisp on the display canvas) ----------
const FONT = '"Press Start 2P", monospace';
const TQ = [], TU = [];
let CURQ = TQ;
function txt(s, x, y, col = '#fff', o = {}) { CURQ.push(Object.assign({ s: String(s), x, y, col }, o)); }
function wrap(s, max) {
  const out = [];
  for (const para of String(s).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      if (line && line.length + 1 + w.length > max) { out.push(line); line = w; }
      else line = line ? line + ' ' + w : w;
    }
    out.push(line);
  }
  return out;
}
function flushText(Q) {
  D.textBaseline = 'top';
  for (const t of Q) {
    const size = t.size || 8, sz = size * SC;
    D.font = sz + 'px ' + FONT; D.textAlign = t.align || 'left';
    const px = OX + t.x * SC, py = OY + t.y * SC;
    if (t.sh !== false) { D.fillStyle = t.sh || 'rgba(0,0,0,.6)'; D.fillText(t.s, px + sz / 8, py + sz / 8); }
    D.fillStyle = t.col; D.fillText(t.s, px, py);
  }
  Q.length = 0;
}

// ---------- input ----------
const KEYS = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowUp: 'U', KeyW: 'U', ArrowDown: 'D', KeyS: 'D',
  KeyZ: 'A', Space: 'A', Enter: 'A', KeyJ: 'A', KeyX: 'B', Escape: 'B', KeyK: 'B', Backspace: 'B', KeyM: 'M' };
const held = {}, prs = {};
function press(b) { if (!held[b]) prs[b] = true; held[b] = true; AU.init(); }
function release(b) { held[b] = false; }
addEventListener('keydown', e => { const b = KEYS[e.code]; if (b) { e.preventDefault(); press(b); } });
addEventListener('keyup', e => { const b = KEYS[e.code]; if (b) release(b); });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
const btn = b => !!prs[b];
const hold = b => !!held[b];
function setupTouch() {
  document.querySelectorAll('[data-b]').forEach(el => {
    const b = el.dataset.b;
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); press(b); el.classList.add('on'); });
    const up = e => { release(b); el.classList.remove('on'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); press('A'); setTimeout(() => release('A'), 60); });
}

// ---------- timers ----------
const G = { t: 0, scene: null, ui: null, mini: null, fade: 0, fadeCol: '#000', shake: 0, timers: [], flash: 0, hud: null };
function wait(s) { return new Promise(r => G.timers.push({ t: s, r })); }
function tween(o, k, to, dur) {
  const from = o[k];
  return new Promise(r => G.timers.push({ t: dur, d: dur, step: p => (o[k] = lerp(from, to, p)), r }));
}
const fadeOut = (d = 0.5, col = '#000') => { G.fadeCol = col; return tween(G, 'fade', 1, d); };
const fadeIn = (d = 0.5) => tween(G, 'fade', 0, d);
function shake(a = 4) { G.shake = Math.max(G.shake, a); }

// ================= AUDIO =================
const AU = {
  ctx: null, on: true, cur: null, timer: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
      this.mus = this.ctx.createGain(); this.mus.gain.value = 0.32; this.mus.connect(this.master);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.55; this.sfx.connect(this.master);
      const len = this.ctx.sampleRate; this.nbuf = this.ctx.createBuffer(1, len, len);
      const d = this.nbuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    } catch (e) { this.ctx = null; }
  },
  toggle() { this.on = !this.on; if (this.master) this.master.gain.value = this.on ? 0.5 : 0; if (BGM.el) BGM.el.muted = !this.on; }

function tone(f, dur, type = 'square', vol = 0.2, when = 0, slide = 0, dest) {
  const a = AU.ctx; if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(dest || AU.sfx); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, when = 0, hp = 800, dest) {

  const t = a.currentTime + when, s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  s.buffer = AU.nbuf; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);

const SFX = {
  blip: (p = 400) => tone(p, 0.045, 'square', 0.07),
  sel: () => tone(660, 0.06, 'square', 0.12),
  ok: () => { tone(660, 0.07, 'square', 0.14); tone(990, 0.12, 'square', 0.14, 0.07); },
  good: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.12, i * 0.07)); },
  bad: () => { tone(300, 0.25, 'sawtooth', 0.14, 0, 0.5); },
  hit: () => { noise(0.15, 0.3, 0, 300); tone(140, 0.15, 'square', 0.2, 0, 0.5); },
  whoosh: () => noise(0.3, 0.15, 0, 1500),
  splash: () => { noise(0.6, 0.3, 0, 400); tone(400, 0.3, 'sine', 0.15, 0, 0.4); },
  honk: () => { tone(330, 0.25, 'sawtooth', 0.15); tone(415, 0.25, 'sawtooth', 0.1); },
  ring: () => { for (let i = 0; i < 6; i++) { tone(1320, 0.05, 'square', 0.09, i * 0.08); tone(1100, 0.05, 'square', 0.09, i * 0.08 + 0.04); } },
  pager: () => { for (let i = 0; i < 3; i++) tone(2200, 0.06, 'square', 0.08, i * 0.12); },
  heart: () => { tone(880, 0.1, 'triangle', 0.2); tone(1320, 0.25, 'triangle', 0.2, 0.1); },
  crush: () => { tone(500, 0.6, 'triangle', 0.2, 0, 0.3); noise(0.2, 0.1, 0.1, 2000); },
  laugh: () => { for (let i = 0; i < 7; i++) { tone(rnd(500, 700), 0.07, 'square', 0.06, i * 0.09, 0.8); tone(rnd(300, 420), 0.07, 'square', 0.05, i * 0.1 + 0.03, 0.8); } },
  crack: () => { noise(0.08, 0.3, 0, 2000); tone(200, 0.1, 'square', 0.1, 0.02, 0.5); },
  pop: () => { noise(0.05, 0.4, 0, 1000); tone(900, 0.15, 'sine', 0.2, 0, 0.3); },
  coin: () => { tone(988, 0.06, 'square', 0.12); tone(1319, 0.2, 'square', 0.12, 0.06); },
  thud: () => { tone(90, 0.25, 'sine', 0.4, 0, 0.5); noise(0.1, 0.2, 0, 200); },
  click: () => tone(1200, 0.02, 'square', 0.08),
  step: () => noise(0.03, 0.04, 0, 3000),
  wah: () => { [392, 370, 349, 330].forEach((f, i) => tone(f, i == 3 ? 0.6 : 0.25, 'sawtooth', 0.1, i * 0.28)); },
  sting: () => { [262, 330, 392, 523].forEach((f, i) => tone(f, 0.5, 'square', 0.08, 0)); },
  rec: () => { tone(440, 0.05, 'square', 0.08); tone(880, 0.05, 'square', 0.08, 0.06); },
};
function sfx(n, ...a) { if (AU.ctx && SFX[n]) SFX[n](...a); }

// ---------- chiptune sequencer ----------
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midi(n) { // "C#5" "Bb4"

    const [n, l] = tok.split(':'); const len = +l || 2;

    s += len;

}
const TRACKS = {};
// The title theme is a real recording (Soundtrack/ next to the HTML file); if it is missing or
// fails to load, the chiptune version below plays instead.
const SONG = { title: 'Soundtrack/Tony Sly - Soulmate Acoustic.mp3' };
const BGM = { el: null, bad: false, name: null };
function songPlay(name) {
  if (BGM.bad) return false;
  if (!BGM.el) {
    BGM.el = new Audio(encodeURI(SONG[name])); BGM.el.loop = true; BGM.el.volume = 0.7;

function MG_drive(o) {

  return {
    t: 0, lane: 1, x: lanes[1], cars: [], spawn: 1, hits: 0, scroll: 0, done: false, spd: o.speed || 140, extra: {},

      if (inp && btn('L')) this.lane = Math.max(0, this.lane - 1);
      if (inp && btn('R')) this.lane = Math.min(2, this.lane + 1);
      this.x = lerp(this.x, lanes[this.lane], Math.min(1, dt * 12));

      for (const c of this.cars) { c.y += (this.spd - c.v) * dt; if (!c.hit && Math.abs(lanes[c.lane] - this.x) < 12 && Math.abs(c.y - (H - 40)) < (c.kind == 'truck' ? 25 : 21)) { c.hit = true; this.hits++; sfx('hit'); shake(5); o.onHit && o.onHit(this); } }
      this.cars = this.cars.filter(c => c.y < H + 40);
      o.onTick && o.onTick(this, dt, inp);
      if (o.time && this.t >= o.time && !this.done) { this.done = this.t; sfx('good'); }
    },
    draw(c) {
      R(c, 0, 0, W, H, o.ground || '#3a7a3a');
      if (o.side) o.side(c, this);
      const rx = W / 2 - 54; R(c, rx, 0, 108, H, '#45454e'); R(c, rx, 0, 3, H, '#ddd'); R(c, rx + 105, 0, 3, H, '#ddd');

      if (o.draw) o.draw(c, this);
      if (o.time && !this.done) txt(Math.max(0, o.time - this.t).toFixed(1), W - 10, 8, '#fff', { size: 8, align: 'right' });
    }
  };
}

}

function emailPrologue() {
  const body = "Hi meghan, im gettin ready to go pick up your wrist thing now and i just wanted to let you know that incase i cant get a hold of you before tonight i'll pick you up at 6:15. i cant wait, it should a fun night, i cant think of any other girl i would rather be going with. whatever you want to do afterwards is fine with me, just let me know. talk to you later, bye. LOVE, joejoe";
  return new Promise(res => {
    G.fade = 0; music('sad');
    G.mini = {
      t: 0, n: 0,
      update(dt, inp) { this.t += dt; const p = Math.floor(this.n); this.n = Math.min(body.length, this.n + dt * 40); if (Math.floor(this.n) > p && Math.floor(this.n) % 2) sfx('click'); if (inp && btn('A')) { if (this.n < body.length) this.n = body.length; else { G.mini = null; res(); } } },
      draw(c) {

        R(c, 34, 26, W - 68, 26, '#e8e8e8');
        txt('To:      meghan', 38, 29, INK, { size: 6, sh: false }); txt('Subject: tonight!!!', 38, 40, INK, { size: 6, sh: false });
        R(c, 34, 54, W - 68, 124, '#fff');
        wrap(body.slice(0, Math.floor(this.n)), 50).forEach((l, i) => txt(l, 38, 58 + i * 10, '#102080', { size: 6, sh: false }));
        if (this.n >= body.length) { O(c, W - 84, 160, 44, 14, '#c0c0c0', INK); txt('Send', W - 62, 164, INK, { size: 6, align: 'center', sh: false }); }

// ---------- Chapter 1 ----------
function MG_courage() {
  const smooth = ['You know, I was thinking tonight.', 'There is nobody', 'that I would rather', 'go to the prom with', 'than you.'];
  const stam = ['You... you know I was th-thinking tonight.', 'There is... well there is nobody', 'that I... I would rath... rather', 'go to the pr... prom with', 'than... y-you.'];
  const built = []; MG_courage.built = built;
  const g = MG_timing({
    rounds: smooth, speed: 0.75, zone: 0.26, jitter: 0.05, accel: 1.22,
    onHit: i => built.push(smooth[i]), onMiss: i => built.push(stam[i]),
    label: (i) => 'Say: "' + smooth[i] + '"',
    draw(c, st) {
      R(c, 0, 0, W, H, '#3a1a30'); for (let i = 0; i < 12; i++) R(c, i * 32 + (G.t * 10 % 32), 0, 2, H, '#4a2440');
      bigPortrait(c, 40, 34, 'joe', st.last === false ? 'nervous' : st.i ? 'blush' : 'nervous', OUT.uni, 2);
      bigPortrait(c, W - 136, 34, 'meghan', 'n', OUT.tee('#e8a0c0'), 2);
      const bpm = 90 + st.i * 22 + (st.log.filter(x => !x).length * 15);
      txt('♥ ' + bpm + ' BPM', W / 2, 60, '#f66', { size: 8, align: 'center' });
      for (let x = 0; x < 80; x++) { const y = 80 + (((x + G.t * 60) % 20) < 2 ? -8 * Math.sin(x) : 0); R(c, W / 2 - 40 + x, y, 1, 1, '#f66'); }
      wrap(built.join(' '), 44).slice(-3).forEach((l, i) => txt(l, W / 2, 8 + i * 10, '#fff', { size: 7, align: 'center' }));
      txt('NO-TOUCH ZONE', W / 2, 110, '#f9c', { size: 6, align: 'center' }); R(c, W / 2 - 40, 120, 80, 1, '#f9c');
    }
  });
  g.built = built; return g;
}

function MG_aim() {
  const opts = ['cool. pick u up at 6:15', "sweet, it'll be fun", 'k', 'sounds good meggie'];
  const target = 'I am so happy I could cry';
  return {
    ph: 0, sel: 0, typed: '', t: 0, n: 0,
    update(dt, inp) {
      this.t += dt;
      if (this.ph == 0 && inp) { if (btn('U')) { this.sel = (this.sel + 3) % 4; sfx('click'); } if (btn('D')) { this.sel = (this.sel + 1) % 4; sfx('click'); } if (btn('A')) { this.ph = 1; sfx('ok'); } }
      else if (this.ph == 1 && inp && btn('A')) {
        this.n++; sfx('click');
        if (this.n <= 3) this.typed = opts[this.sel].slice(0, this.n * 2);
        else { if (this.n == 4) { shake(4); sfx('bad'); } const k = Math.min(target.length, (this.n - 3) * 4); this.typed = target.slice(0, k); if (k >= target.length) { this.ph = 2; this.t = 0; sfx('sel'); } }
      } else if (this.ph == 2 && this.t > 3.2) this.res({ score: 0.03 });
    },
    draw(c) {
      desktop98(c); aimWin(c, 40, 10, W - 80, 176, 'xMeggieMoox - Instant Message');
      R(c, 44, 24, W - 88, 100, '#fff');
      txt('xMeggieMoox:', 48, 30, '#c00000', { size: 6, sh: false });
      txt('i GUESS i will go prom with you, it better', 48, 40, INK, { size: 6, sh: false }); txt('be fun though.', 48, 50, INK, { size: 6, sh: false });
      if (this.ph == 2) { txt('VikingJoe99:', 48, 66, '#0000c0', { size: 6, sh: false }); txt(target + '.', 48, 76, INK, { size: 6, sh: false }); if (this.t > 1.5) txt('xMeggieMoox has signed off.', 48, 94, '#888', { size: 6, sh: false }); }
      R(c, 44, 128, W - 88, 30, '#fff'); O(c, W - 96, 162, 50, 16, '#c0c0c0', INK); txt('Send', W - 71, 167, INK, { size: 6, sh: false, align: 'center' });
      if (this.ph == 0) {
        txt('PLAY IT COOL. Pick a reply (UP/DOWN, A):', 48, 131, '#0000c0', { size: 5, sh: false });
        opts.forEach((o, i) => txt((i == this.sel ? '> ' : '  ') + o, 52 + (i % 2) * 130, 140 + Math.floor(i / 2) * 9, i == this.sel ? '#c00000' : INK, { size: 5, sh: false }));
      } else txt(this.typed + (Math.floor(G.t * 3) % 2 ? '|' : ''), 48, 136, INK, { size: 6, sh: false });

    }
  };

// ================= TITLE, CREDITS, BOOT =================
function titleScreen() {
  return new Promise(res => {
    G.hudOn = false; G.scene = null; G.mini = null; G.fade = 0; music('title');
    const sv = SAVE.get(), max = sv.done ? CHAPTERS.length - 1 : (sv.max || 0);
    const main = ['NEW GAME']; if (max > 0) main.push('CONTINUE  CH.' + (max + 1)); main.push('CHAPTER SELECT');
    G.ui = {
      i: 0, sub: false, j: 0, t: 0,
      update(dt) {
        this.t += dt;
        const list = this.sub ? CHAPTERS.slice(0, max + 1) : main, n = list.length;
        if (btn('U')) { (this.sub ? this.j = (this.j + n - 1) % n : this.i = (this.i + n - 1) % n); sfx('click'); }
        if (btn('D')) { (this.sub ? this.j = (this.j + 1) % n : this.i = (this.i + 1) % n); sfx('click'); }
        if (btn('B') && this.sub) { this.sub = false; sfx('click'); }
        if (btn('A')) {
          sfx('ok');
          if (this.sub) return go(this.j);
          const it = main[this.i];
          if (it == 'NEW GAME') { G.stats = { dig: 100, cash: 0 }; return go(0); }
          if (it.startsWith('CONTINUE')) return go(max);
          this.sub = true; this.j = 0;
        }
      },
      draw(c) {
        drawTitleBG(c, this.t);
        txt("PROM NIGHT '99", W / 2, 14, '#ffd23a', { size: 20, align: 'center', sh: '#3a1a6a' });
        txt('THE JOEJOE CHRONICLES', W / 2, 42, '#fff', { size: 8, align: 'center', sh: '#3a1a6a' });
        txt('BISHOP VEROT HIGH SCHOOL · CLASS OF 1999', W / 2, 55, '#ffe9a0', { size: 5, align: 'center', sh: '#3a1a6a' });
        drawTitleCast(c, this.t);
        if (!this.sub) main.forEach((m, k) => { const y = 80 + k * 17; RR(c, W / 2 - 70, y - 4, 140, 15, k == this.i ? '#ffd23a' : '#2a1660', k == this.i ? '#fff' : '#ffd23a'); txt(m, W / 2, y, k == this.i ? '#2a1660' : '#fff', { size: 7, align: 'center', sh: false }); });
        else {
          RR(c, 110, 66, 164, 118, '#2a1660', '#ffd23a');
          const top = Math.max(0, Math.min(this.j - 3, CHAPTERS.length - 7));
          CHAPTERS.slice(0, max + 1).forEach((ch, k) => { if (k < top || k >= top + 7) return; const y = 72 + (k - top) * 15; if (k == this.j) R(c, 114, y - 3, 156, 13, '#4a2a9a'); txt((k + 1) + '. ' + ch.title, 120, y, k == this.j ? '#ffd23a' : '#eee', { size: 6 }); });
          txt('B: BACK', 192, 176, '#bbb', { size: 5, align: 'center' });
        }
        txt('ARROWS/WASD: MOVE   Z/SPACE: A   X: B   M: MUTE', W / 2, H - 9, '#fff', { size: 5, align: 'center', sh: '#3a1a6a' });
      }
    };
    const jump = /[?&]ch=(\d+)/.exec(location.search); if (AUTO && jump) { setTimeout(() => go(+jump[1] - 1), 0); }
    function go(k) { G.ui = null; if (k > 0 && sv['s' + k]) G.stats = Object.assign({}, sv['s' + k]); res(k); }
  });
}
// title backdrop: a slowly turning sunburst in purple and gold over a warm parquet stage
function drawTitleBG(c, t) {
  const g = c.createRadialGradient(W / 2, 70, 10, W / 2, 70, 260); g.addColorStop(0, '#8a4ae0'); g.addColorStop(1, '#2a1660');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.translate(W / 2, 70); c.rotate(t * 0.06);
  for (let i = 0; i < 16; i++) { c.rotate(Math.PI / 8); c.beginPath(); c.moveTo(0, 0); c.lineTo(400, -60); c.lineTo(400, 60); c.closePath(); c.fillStyle = i % 2 ? 'rgba(255,210,58,.16)' : 'rgba(255,255,255,.05)'; c.fill(); }
  c.restore();
  // confetti
  for (let i = 0; i < 26; i++) { const x = (i * 71 + t * (8 + i % 5 * 3)) % (W + 20) - 10, y = (i * 43 + t * (14 + i % 4 * 5)) % (H + 20) - 10; c.save(); c.translate(x, y); c.rotate(t * 2 + i); c.fillStyle = ['#ffd23a', '#ff4a8a', '#3ad0ff', '#5aff8a', '#fff'][i % 5]; c.fillRect(-1.5, -0.8, 3, 1.6); c.restore(); }
  // floor
  const fy = 180; c.fillStyle = '#e0a24a'; c.fillRect(0, fy, W, H - fy);
  for (let x = -20, i = 0; x < W + 20; x += 24, i++) for (let y = fy, j = 0; y < H; y += 12, j++) { c.fillStyle = (i + j) % 2 ? '#f0b85a' : '#d08e3a'; c.fillRect(x + (j % 2) * 12, y, 23, 11); }
  c.fillStyle = 'rgba(60,20,0,.25)'; c.fillRect(0, fy, W, 3);
}
// the four leads in their everyday looks, two on each side of the menu
const TITLE_CAST = [['ken', OUT.aero, 34, 'n', {}], ['joe', OUT.stripe, 92, 'n', {}], ['meghan', OUT.xmas, 292, 'n', {}], ['meech', OUT.crew, 350, 'n', { hat: '#5ccc9e' }]];
function drawTitleCast(c, t) {
  TITLE_CAST.forEach(([id, o, x, f, opt], i) => {
    const b = Math.abs(Math.sin(t * 2.2 + i * 1.3)) * 2.5, blink = (t + i * 0.7) % 4 < 0.12;
    drawChar(c, x, 204 - b, id, o, 'd', 0, blink ? 'blink' : f, Object.assign({ s: 1.12 }, opt));
  });
  emoteAt(c, 104, 92 + Math.sin(t * 3) * 2, 'heart', t); emoteAt(c, 280, 94, 'note', t);
}

        cast.forEach(([id, n, d], i) => { const y = y0 + 80 + i * 34; drawChar(c, W / 2 - 80, y + 24, id, PROMOUT[id] || OUT.tee(CHARS[id].col), 'd', Math.floor(G.t * 4) % 4, 'h'); txt(n, W / 2 - 60, y + 6, '#fff', { size: 8 }); txt(d, W / 2 - 60, y + 17, '#aaa', { size: 5 }); });
        const e = y0 + 80 + cast.length * 34 + 20;
        ['Based on a true story.', 'Names were not changed.', 'Nobody was innocent.', '', 'Bishop Verot High School', 'Class of 1999', '', 'GO VIKINGS'].forEach((l, i) => txt(l, W / 2, e + i * 13, i > 3 ? GOLD : '#ddd', { size: 7, align: 'center' }));
        if (this.t > 4) txt('A: TITLE', W - 10, H - 12, '#777', { size: 5, align: 'right' });
      }
    };
  });
}
async function mainLoop() {
  while (true) {
    const start = await titleScreen();
    for (let i = start; i < CHAPTERS.length; i++) {
      const sv = SAVE.get(); SAVE.set({ max: Math.max(sv.max || 0, i), ['s' + i]: Object.assign({}, G.stats) });
      G.grades = [];
      LOG.push('START ' + (i + 1));
      await CHAPTERS[i].run();
      LOG.push('END ' + (i + 1));
    }
    SAVE.set({ done: 1 });
    await credits();
  }
}
resize(); setupTouch();
if (AUTO) setTimeout(() => frame(performance.now()), 0); else requestAnimationFrame(frame);
(document.fonts ? document.fonts.load('8px "Press Start 2P"').catch(() => { }) : Promise.resolve()).then(() => mainLoop());
